# Project settings --------------------------------------------------------------------
[project]
name = "orformer"
version = "1.0.0"
description = "ORFormer: Occlusion-Robust Transformer for Accurate Facial Landmark Detection"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Seokyong Shin", email = "kistssy@gmail.com" }]

# Required dependencies ---------------------------------------------------------------
dependencies = [
    "einops",
    "numpy",
    "onnxruntime-gpu[cuda,cudnn]",
    "opencv-python",
    "pillow",
    "scipy",
    "torch",
    "torchinfo",
    "torchlm",
    "torchvision",
    "tqdm",
    "wandb",
    "yacs",
]

# Optional dependencies ---------------------------------------------------------------
[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[project.urls]
Repository = "https://github.com/synml/ORFormer"

# Tools settings ----------------------------------------------------------------------
[tool.uv]
# torchlm이 요구하는 CPU용 onnxruntime을 설치하지 않는다(onnxruntime-gpu와 같은 모듈을 덮어씀).
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
exclude = ["Dataset", "weights", "**/__pycache__", "**/.*"]

[tool.ruff.lint]
# 원본 저장소의 대문자 모듈명(Config, Model, VQVAE 등)은 import 경로라 유지한다.
ignore = ["N999"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"
